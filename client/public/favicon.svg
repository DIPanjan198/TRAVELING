<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="60%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Glass Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

  <!-- Speed Trail / Orbit Arc -->
  <path d="M12 48 C16 38, 26 28, 38 22" fill="none" stroke="url(#trailGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.8" />

  <!-- Sleek Airplane Icon in Flight -->
  <g transform="translate(14, 14) scale(1.5)" filter="url(#glow)">
    <path 
      d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3.5c-.5-.5-2.5 0-4 1.5L13.5 8.5 5.3 6.7c-.9-.2-1.6.1-2 .5-.3.3-.4.8-.2 1.3l5 3.5-3.5 3.5-3-1-1.5 1.5 4 1 1 4 1.5-1.5-1-3 3.5-3.5 3.5 5c.5.2 1 .1 1.3-.2.4-.4.7-1.1.5-2z" 
      fill="url(#planeGrad)" 
      stroke="#4338CA" 
      stroke-width="0.5"
      stroke-linejoin="round"
    />
  </g>

  <!-- Accent Sparkle / North Star -->
  <circle cx="50" cy="14" r="2.2" fill="#FDE047" opacity="0.95" />
  <path d="M50 10 L50 18 M46 14 L54 14" stroke="#FDE047" stroke-width="0.8" opacity="0.7" stroke-linecap="round" />
</svg>
